config:
  validation: true
  warningsAsErrors: false

processors:
  active: true
  exclude: [ ]

console-reports:
  active: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

complexity:
  active: true
  LongParameterList:
    active: true
    allowedFunctionParameters: 6
    allowedConstructorParameters: 7
  TooManyFunctions:
    active: true
    # ignoreOverridden: framework-mandated lifecycle callbacks (onCreate, onNewIntent, ...) are
    # not class-owned complexity.
    # Why: allowedFunctionsPerClass raised above the default 11 — TabIconsFragment (search mode,
    # action mode, swipe-to-delete, settings dialog, index scroll) and TabPickerFragment own
    # several independent OneUI-widget-demo concerns in one class by design, mirroring this
    # sample app's per-tab structure; TabIconsFragment currently needs 24. Splitting them into
    # collaborator classes is a larger structural change than this cleanup pass covers.
    ignoreOverridden: true
    allowedFunctionsPerClass: 24
  ComplexCondition:
    allowedConditions: 4

style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers: [ '-1', '0', '1', '2' ]
    ignorePropertyDeclaration: false
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 140
  ForbiddenComment:
    active: true
    comments: [ 'TODO:', 'FIXME:' ]
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true

naming:
  FunctionNaming:
    functionPattern: '[a-z][A-Za-z0-9]*'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'

empty-blocks:
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: false

exceptions:
  active: true
  TooGenericExceptionThrown:
    active: true
    exceptionNames:
      - Error
      - Exception
      - RuntimeException
      - Throwable
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - InterruptedException
      - MalformedURLException
      - NumberFormatException
      - ParseException

potential-bugs:
  active: true
  ImplicitDefaultLocale:
    active: true
  UnsafeCallOnNullableType:
    active: true
